<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#15101f">
  <meta name="description" content="Photo Munchies is a live camera fruit-munching game for kids.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Photo Munchies">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="refresh" content="0; url=live.html">
  <title>Photo Munchies</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --ink: #0a0612;
      --paper: #fff6ff;
      --pink: #ff2d8e;
      --yellow: #c6ff36;
      --blue: #28e6ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 22% 16%, rgba(255, 45, 142, 0.24), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(40, 230, 255, 0.18), transparent 26%),
        #15101f;
      color: var(--paper);
      font-family: ui-rounded, "Avenir Next", system-ui, sans-serif;
      text-align: center;
    }

    main {
      width: min(460px, 100%);
    }

    .burst {
      width: 156px;
      height: 156px;
      margin: 0 auto 18px;
      border: 5px solid var(--ink);
      border-radius: 50%;
      background:
        radial-gradient(circle at 54% 46%, var(--yellow) 0 20%, transparent 21%),
        conic-gradient(from 12deg, var(--pink), #9b6bff, var(--blue), var(--yellow), #ff9d2e, var(--pink));
      box-shadow: 0 0 0 7px rgba(255, 246, 255, 0.1), 0 0 40px rgba(255, 45, 142, 0.42);
    }

    h1 {
      margin: 0 0 10px;
      color: var(--pink);
      font-size: clamp(46px, 13vw, 68px);
      line-height: 0.9;
      text-shadow: 3px 3px 0 var(--ink), 0 0 18px rgba(255, 45, 142, 0.62);
    }

    p {
      margin: 0 0 22px;
      color: #cbb8ec;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
    }

    a {
      display: block;
      min-height: 62px;
      border: 4px solid var(--ink);
      border-radius: 18px;
      padding: 16px 18px;
      background: linear-gradient(180deg, var(--yellow), #92e900);
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.46), 0 0 22px rgba(255, 45, 142, 0.28);
      color: #08030f;
      font-size: 22px;
      font-weight: 1000;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="burst" aria-hidden="true"></div>
    <h1>Photo Munchies</h1>
    <p>Opening the live fruit-munching game...</p>
    <a href="live.html">Start Live Fruit Munch</a>
  </main>
  <script>
    window.location.replace("live.html");
  </script>
</body>
</html>
