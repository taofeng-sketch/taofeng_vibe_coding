name: WorldCupSimulation Four-Hour Refresh

on:
  schedule:
    - cron: "30 1,5,9,13,17,21 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldcup-four-hour-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorldCupSimulation
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh scoreboard snapshot
        run: npm run update-data
      - name: Validate refreshed data
        run: |
          npm test
          npm run check
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- live-snapshot.js; then
            echo "Snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-snapshot.js
          git commit -m "Update World Cup snapshot $(date -u '+%F %H:%M UTC')"
          git push
