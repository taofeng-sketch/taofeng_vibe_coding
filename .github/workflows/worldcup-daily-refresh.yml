name: WorldCupSimulation Daily Refresh

on:
  schedule:
    - cron: "30 13 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldcup-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorldCupSimulation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh scoreboard snapshot
        run: npm run update-data
      - name: Validate refreshed data
        run: |
          npm test
          npm run check
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- live-snapshot.js; then
            echo "Snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-snapshot.js
          git commit -m "Update World Cup daily snapshot $(date -u +%F)"
          git push
