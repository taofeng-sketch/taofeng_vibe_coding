name: WorldCupSimulation QA

on:
  push:
    paths:
      - "WorldCupSimulation/**"
      - ".github/workflows/worldcup-simulation-qa.yml"
      - ".github/workflows/worldcup-daily-refresh.yml"
  pull_request:
    paths:
      - "WorldCupSimulation/**"
      - ".github/workflows/worldcup-simulation-qa.yml"
      - ".github/workflows/worldcup-daily-refresh.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WorldCupSimulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
